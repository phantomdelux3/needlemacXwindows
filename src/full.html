<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeedleX Now Playing</title>
  <link rel="stylesheet" href="full.css" />
</head>
<body>
  <div id="stage" class="mode-cover">

    <!-- backgrounds -->
    <div id="bg-cover" class="bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="vignette"></div>
    </div>
    <div id="bg-stars" class="bg">
      <div class="zoom"></div>
      <div class="vignette"></div>
    </div>
    <div id="bg-words" class="bg">
      <img class="wash" alt="" />
      <canvas class="hero"></canvas>
      <div class="vignette"></div>
    </div>

    <!-- GPU background for both lyric styles: liquid flow, zoom streaks, edge smear, glitch -->
    <canvas id="bg-gl" class="bg"></canvas>

    <!-- glitter (optional): under the clock, the glass card and the lyrics -->
    <canvas id="glitter"></canvas>

    <!-- clock -->
    <div id="clock">
      <div class="date"></div>
      <div class="time"></div>
    </div>

    <!-- cover view -->
    <div id="cover">
      <div class="art-box"><canvas id="art"></canvas></div>
      <div class="card">
        <div class="row-top">
          <div class="vinyl"><img alt="" /></div>
          <div class="meta">
            <div class="title"></div>
            <div class="artist"></div>
          </div>
          <div class="mini-bars"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="row-progress">
          <span class="el">0:00</span>
          <div class="bar"><div class="fill"></div></div>
          <span class="rem">-0:00</span>
        </div>
        <div class="row-controls">
          <span class="spacer"></span>
          <div class="transport">
            <button data-act="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M11.5 12 20 6.2v11.6zM3 12l8.5-5.8v11.6z" fill="currentColor"/></svg></button>
            <button data-act="toggle" class="pp" title="Play / Pause">
              <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.8l11-7.2a1 1 0 0 0 0-1.6l-11-7.2C7.9 3.5 7 4 7 4.8z" fill="currentColor"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.2" fill="currentColor"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2" fill="currentColor"/></svg>
            </button>
            <button data-act="next" title="Next"><svg viewBox="0 0 24 24"><path d="M12.5 12 4 17.8V6.2zM21 12l-8.5 5.8V6.2z" fill="currentColor"/></svg></button>
          </div>
          <span class="output" title="Output"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 20h8l-4-4.5z" fill="currentColor"/></svg></span>
        </div>
      </div>
    </div>

    <!-- lyrics: constellation ("stars") style -->
    <div id="stars" class="lyr"></div>

    <!-- lyrics: big words style -->
    <div id="words" class="lyr"></div>

    <div id="lyr-msg"></div>

    <div id="corner">
      <img id="thumb" alt="" title="Back to cover" />
      <button id="style-btn" title="Lyrics style">Aa</button>
    </div>

    <!-- beat glow: a line of light around the screen edge, in the cover's colours -->
    <div id="edge"><canvas id="edge-gl"></canvas></div>

    <div id="hint">Triple-click the sides to exit</div>
  </div>

  <script src="glass.js"></script>
  <script src="flow.js"></script>
  <script src="edge.js"></script>
  <script src="glitter.js"></script>
  <script src="full.js"></script>
</body>
</html>
